name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42
      # Annotations (Hypothesis) are on by default via _quarto.yml;
      # answers/ is excluded from the render there. The figures are
      # pre-rendered SVGs (see _tikz/), so the render needs no LaTeX.
      - run: quarto render
      # ── Password protection (StatiCrypt) ────────────────────────────
      # Every HTML page is encrypted; assets are copied alongside.
      # search.json carries the full text in clear, so it is removed
      # (search is also off in _quarto.yml). The password can be
      # overridden without editing this file by adding a SITE_PASSWORD
      # repository secret. NOTE: the repository is public, so the
      # fallback password below - like the chapter sources themselves -
      # is world-readable; the gate keeps casual visitors and search
      # engines out, it is not real secrecy.
      - name: Encrypt site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD || 'GRC1100-2026' }}
        run: |
          rm -f _site/search.json
          npx --yes staticrypt _site -r -d _encrypted \
            --password "$SITE_PASSWORD" --remember 30 --short
          rm -rf _site
          mv _encrypted/_site _site
          rm -f _site/search.json _site/.staticrypt.json
      # Fail the deploy if any page still carries the script's text in
      # clear (a distinctive sentence from chapter 1).
      - name: Verify no plaintext leaks
        run: |
          if grep -rl "digital businesses, whether" _site --include='*.html'; then
            echo "PLAINTEXT LEAK - aborting deploy"; exit 1
          fi
          test ! -f _site/search.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
